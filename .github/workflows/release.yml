name: release

# Changesets release flow (both packages, independent versions):
#   1. Land PRs that include a changeset (`.changeset/*.md`) on main.
#   2. This workflow opens/updates a "Version Packages" PR that bumps versions
#      and updates changelogs from the pending changesets.
#   3. Merging that PR (which removes the changesets) makes this workflow run
#      `changeset publish`, publishing the changed packages (`webveil`,
#      `pi-webveil`) to npm. A package whose version is already on npm is
#      skipped, so releasing one package does not republish the other.
#
# Auth is npm Trusted Publishing (OIDC): NO NPM_TOKEN secret. npm trusts this
# repo + workflow (release.yml) via the trusted publisher registered on each
# package's npmjs.com settings. The OIDC handshake needs `id-token: write`,
# Node >= 22, and a recent pnpm; publishes are stamped with provenance.
# `webveil` and `pi-webveil` were published by hand up to 0.4.0 (with the old
# local `pnpm release` script, now retired). Their trusted publishers are
# registered (repo wighawag/webveil, workflow release.yml, so this file must
# keep that exact name), and every release from here on goes through this
# tokenless OIDC flow; there is no local publish path any more.
on:
  push:
    branches: [main]
  # Manual trigger from the Actions tab, e.g. to (re-)run the Version-PR / publish
  # step after a merge that did not emit a push event (a GITHUB_TOKEN API merge
  # does not trigger `on: push`), or to re-publish idempotently.
  workflow_dispatch: {}

# Serialize release runs on main, but NEVER cancel an in-progress one:
# `changeset publish` may be mid-publish, and cancelling it would drop the
# release. `changeset publish` is idempotent (it skips versions already on npm),
# so letting each queued run finish is always safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24 # >= 22 required for npm OIDC trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # release:ci builds + format-checks then runs `changeset publish`
          # (the action itself handles git commits/tags, so no git push here).
          # No NPM_TOKEN: npm detects the OIDC environment and authenticates via
          # the registered trusted publisher.
          publish: pnpm release:ci
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Require provenance instead of relying on auto-detection. pnpm 11
          # publishes natively (not through the npm CLI): it reads this setting
          # from `pnpm_config_*` env vars and ignores a package.json
          # `publishConfig.provenance`. With it set, a publish that cannot be
          # attested fails instead of going out unstamped.
          PNPM_CONFIG_PROVENANCE: true
